# Migrations for the app's own tables (schema "app"). The analytics data is not managed here.
# Run from apps/api: alembic upgrade head. The database URL comes from the app settings (APP_DATABASE_URL,
# falling back to DATABASE_URL), not from this file.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s: %(message)s
