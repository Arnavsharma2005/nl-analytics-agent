# Verified queries: questions with SQL that a person has checked by hand against the data.
#
# The analyst will use these as worked examples for similar questions, and can answer a question that matches one
# outright. Starter questions are the examples the app offers on its front page.
#
# Rules, checked in CI (tests/test_semantic.py):
# - every query passes the SQL guard and runs;
# - none gives away a held-out eval question: no query may return the same result as a test-split question's gold
#   query, or ask a near-identical question. Add new queries from real usage or the eval dev split only.
#
# `verified_by: seed` marks the queries taken from the eval dev split when this library was started; eval dev
# questions #1 and #9 are left out because their answers are the same as test questions #78 and #102.

queries:

  - question: How many orders were cancelled in 2024?  # eval #2
    verified_by: seed
    verified_at: 2026-10-22
    sql: |
      SELECT COUNT(*) AS cancelled_orders FROM orders
      WHERE status = 'cancelled' AND order_date BETWEEN '2024-01-01' AND '2024-12-31'

