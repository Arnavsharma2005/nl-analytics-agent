  - question: List the top 3 products by revenue in each category for 2025  # eval #29
    verified_by: seed
    verified_at: 2026-10-22
    sql: |
      SELECT category, product, revenue FROM (
        SELECT c.name AS category, p.name AS product, ROUND(SUM(oi.quantity * oi.unit_price), 2) AS revenue,
               ROW_NUMBER() OVER (PARTITION BY c.name ORDER BY SUM(oi.quantity * oi.unit_price) DESC) AS rn
        FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
        JOIN products p ON p.product_id = oi.product_id
        JOIN categories c ON c.category_id = p.category_id
        WHERE o.status = 'completed' AND o.order_date BETWEEN '2025-01-01' AND '2025-12-31'
        GROUP BY c.name, p.product_id, p.name
      ) ranked WHERE rn <= 3

