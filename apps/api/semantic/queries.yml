  - question: What was the month-over-month revenue growth in percent for each month of 2025?  # eval #39
    verified_by: seed
    verified_at: 2026-10-22
    sql: |
      WITH monthly AS (
        SELECT date_trunc('month', o.order_date)::date AS month, SUM(oi.quantity * oi.unit_price) AS revenue
        FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
        WHERE o.status = 'completed' AND o.order_date BETWEEN '2024-12-01' AND '2025-12-31'
        GROUP BY 1
      )
      SELECT month, ROUND((revenue - LAG(revenue) OVER (ORDER BY month)) / LAG(revenue) OVER (ORDER BY month) * 100, 2) AS growth_pct
      FROM monthly ORDER BY month OFFSET 1

