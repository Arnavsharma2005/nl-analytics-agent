  - question: Which region grew revenue the fastest from 2024 to 2025, in percent?  # eval #24
    verified_by: seed
    verified_at: 2026-10-22
    starter: true
    sql: |
      WITH yearly AS (
        SELECT r.name AS region,
               SUM(oi.quantity * oi.unit_price) FILTER (WHERE EXTRACT(YEAR FROM o.order_date) = 2024) AS rev_2024,
               SUM(oi.quantity * oi.unit_price) FILTER (WHERE EXTRACT(YEAR FROM o.order_date) = 2025) AS rev_2025
        FROM orders o JOIN customers c ON c.customer_id = o.customer_id
        JOIN regions r ON r.region_id = c.region_id
        JOIN order_items oi ON oi.order_id = o.order_id
        WHERE o.status = 'completed'
        GROUP BY r.name
      )
      SELECT region, ROUND((rev_2025 - rev_2024) / rev_2024 * 100, 2) AS growth_pct
      FROM yearly ORDER BY growth_pct DESC LIMIT 1

  - question: What is the return rate for each product category?  # eval #25
    verified_by: seed
    verified_at: 2026-10-22
    starter: true
    sql: |
      WITH order_cat AS (
        SELECT DISTINCT o.order_id, o.status, c.name AS category
        FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
        JOIN products p ON p.product_id = oi.product_id
        JOIN categories c ON c.category_id = p.category_id
        WHERE o.status IN ('completed', 'returned')
      )
      SELECT category, ROUND(COUNT(*) FILTER (WHERE status = 'returned') * 100.0 / COUNT(*), 2) AS return_rate_pct
      FROM order_cat GROUP BY category

