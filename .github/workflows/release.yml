name: Release

# On a version tag (v2.3.0), publishes the self-host image to ghcr.io/<owner>/<repo> as 2.3.0, 2.3 and latest, for
# amd64 and arm64, and, when the repository variable PUBLISH_PACKAGES is "true", the Python SDK to PyPI and the
# TypeScript SDK and the widget to npm at the same version. On a pull request that changes the image or the
# self-host bundle, only builds it and runs self-host/smoke.sh against it. See docs/self-host.md and DEPLOY.md.
#
# The Promote workflow runs this on the tag it makes (a tag pushed by a workflow starts no workflow by itself).
# PyPI uses trusted publishing (no token): add this repository and workflow, environment "pypi", as a trusted
# publisher on PyPI. npm needs the NPM_TOKEN secret, an automation token, in the "npm" environment.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:  # on a tag: Actions -> Release -> Run workflow, "Use workflow from" the tag
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - self-host/**
      - apps/api/requirements.txt
      - .github/workflows/release.yml

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: nl-analytics-agent:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the self-host stack and check it answers
        run: self-host/smoke.sh
        env:
          IMAGE: nl-analytics-agent
          VERSION: smoke

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (registry names are lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: latest=auto
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  pypi:
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_PACKAGES == 'true'
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write  # trusted publishing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7  # set-version.sh uses npm for the TypeScript packages
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: packages/set-version.sh "${GITHUB_REF_NAME#v}"
      - name: Build the Python SDK
        working-directory: packages/sdk-py
        run: pip install build==1.3.0 && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/sdk-py/dist

  npm:
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_PACKAGES == 'true'
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write  # npm provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: packages/set-version.sh "${GITHUB_REF_NAME#v}"
      - name: Publish the TypeScript SDK and the widget
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for package in sdk-ts widget; do
            (cd "packages/$package" && npm ci && npm publish --provenance --access public)
          done
