name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: analytics
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/analytics
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt
      - run: pip install -r apps/api/requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit and integration tests (scripted LLM, real Postgres)
        working-directory: apps/api
        run: python -m pytest -q
      - name: The web app's copy of the OpenAPI spec is up to date
        run: python apps/api/scripts/export_openapi.py --check
      - name: Every gold query in the eval set runs
        run: |
          python eval/run_eval.py --gold-only
          python eval/run_eval.py --conversations --gold-only
      - name: Replay the recorded eval run; fail if any question regressed
        if: hashFiles('eval/baseline/cassette.json') != ''
        run: |
          python eval/run_eval.py --replay eval/baseline/cassette.json --out "$RUNNER_TEMP/replay.json"
          python eval/compare.py eval/baseline/results.json "$RUNNER_TEMP/replay.json" --fail-on-regression

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build

  web-next:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-next
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/web-next/package-lock.json
            apps/web-next/tools/package-lock.json
      - run: npm ci
      - name: Types generated from the OpenAPI spec are up to date
        run: npm run gen:api && git diff --exit-code src/api/schema.d.ts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser tests (mocked API) with accessibility checks
        run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: apps/web-next/test-results/
          retention-days: 7

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
