name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: analytics
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/analytics
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt
      - run: pip install -r apps/api/requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit and integration tests (scripted LLM, real Postgres)
        working-directory: apps/api
        run: python -m pytest -q
      - name: The web app's copy of the OpenAPI spec is up to date
        run: python apps/api/scripts/export_openapi.py --check
      - name: The Python SDK's models are generated from that spec
        run: packages/sdk-py/generate.sh && git diff --exit-code packages/sdk-py
      - name: Every gold query in the eval set runs
        run: |
          python eval/run_eval.py --gold-only
          python eval/run_eval.py --conversations --gold-only
      - name: Replay the recorded eval run; fail if any question regressed
        if: hashFiles('eval/baseline/cassette.json') != ''
        run: |
          python eval/run_eval.py --replay eval/baseline/cassette.json --out "$RUNNER_TEMP/replay.json"
          python eval/compare.py eval/baseline/results.json "$RUNNER_TEMP/replay.json" --fail-on-regression

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build

  web-next:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Playwright's image has Chromium and its system libraries already, so nothing comes from the runner's apt
    # mirror (which hung twice installing them). Keep its tag equal to @playwright/test in package.json.
    container: mcr.microsoft.com/playwright:v1.64.0-noble
    defaults:
      run:
        working-directory: apps/web-next
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/web-next/package-lock.json
            apps/web-next/tools/package-lock.json
      - run: npm ci
      # The checkout belongs to another user than the container's root, so git refuses it until it is marked safe.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Types generated from the OpenAPI spec are up to date
        run: npm run gen:api && git diff --exit-code src/api/schema.d.ts
      - run: npm run build
      - name: Browser tests (mocked API) with accessibility checks
        run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: apps/web-next/test-results/
          retention-days: 7

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sdk-ts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk-ts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/sdk-ts/package-lock.json
      - run: npm ci
      - name: Types generated from the OpenAPI spec are up to date
        run: npm run gen && git diff --exit-code src/schema.ts
      - run: npm run typecheck
      - run: npm test
      - name: The package as published imports and type-checks
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer"
          npm init -y >/dev/null && npm install "$RUNNER_TEMP"/nl-analytics-sdk-*.tgz typescript@5.9.3 @types/node@22.20.5
          printf 'import { Analyst } from "nl-analytics-sdk";\nconst a: Analyst = new Analyst({ baseUrl: "http://x" });\nconsole.log(typeof a.ask);\n' > check.mts
          npx tsc --noEmit --strict --module nodenext --moduleResolution nodenext check.mts
          node -e 'import("nl-analytics-sdk").then((m) => { if (typeof m.Analyst !== "function") process.exit(1); })'

  widget:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: mcr.microsoft.com/playwright:v1.64.0-noble  # keep equal to @playwright/test in its package.json
    defaults:
      run:
        working-directory: packages/widget
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/widget/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: The widget on a mocked site and API, with accessibility checks
        run: npx playwright test
