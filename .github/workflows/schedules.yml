name: Schedules

# Hourly: ask the scheduled reports' and alerts' questions that are due and send the answers
# (app/jobs/schedules.py). Needs these repository secrets, the same values as the app's settings:
#   SCHEDULES_DATABASE_URL, SCHEDULES_APP_DATABASE_URL  the data (read-only role) and the app's own tables
#   GROQ_API_KEY / GEMINI_API_KEY                        a model to answer with
#   RESEND_API_KEY, EMAIL_FROM                           to send email (optional)
#   TELEGRAM_BOT_TOKEN                                   to send to Telegram (optional)
# and the repository variable CURATORS (a JSON list of GitHub logins) when the schedules flag is set to "curators".
# Without the database secrets the job says so and stops.

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schedules
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SCHEDULES: "true"
      DATABASE_URL: ${{ secrets.SCHEDULES_DATABASE_URL }}
      APP_DATABASE_URL: ${{ secrets.SCHEDULES_APP_DATABASE_URL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      PUBLIC_URL: https://nl-analytics-agent.onrender.com
      CURATORS: ${{ vars.CURATORS || '[]' }}
    steps:
      - name: Check the database secrets are set
        id: ready
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$APP_DATABASE_URL" ]; then
            echo "::notice::Set SCHEDULES_DATABASE_URL and SCHEDULES_APP_DATABASE_URL to run scheduled reports."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.ready.outputs.go == 'true'
      - uses: actions/setup-python@v6
        if: steps.ready.outputs.go == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - if: steps.ready.outputs.go == 'true'
        run: pip install -r apps/api/requirements.txt
      - name: Run the due schedules
        if: steps.ready.outputs.go == 'true'
        working-directory: apps/api
        run: |
          alembic upgrade head
          python -m app.jobs.schedules
