# Weekly dependency updates, grouped so minor and patch bumps arrive as one PR per ecosystem.
version: 2
updates:
  - package-ecosystem: pip
    directory: /apps/api
    schedule: { interval: weekly }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
    ignore:
      # TypeScript 7 is the native (Go) compiler; move to it deliberately, not through a bot PR.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    ignore:
      # Stay on Node LTS lines; odd-numbered majors are never LTS. Bump the LTS major by hand.
      - dependency-name: node
        update-types: [version-update:semver-major]
