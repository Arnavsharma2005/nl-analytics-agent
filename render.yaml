# Render Blueprint: production and staging, each one Docker web service (API + built frontend), on the free plan.
# In Render: New -> Blueprint -> pick this repo. Render asks for each `sync: false` key; leave unused ones empty.
#
# Production deploys from the `release` branch, which only the Promote workflow moves (DEPLOY.md, "Releasing").
# Staging deploys every merge to `main`, on its own database and keys, so a change is tried there first. Both run
# `alembic upgrade head` as they start, before serving; the running version keeps serving until the new one is
# healthy, and migrations only add (expand, then contract), so the running version keeps working on the new schema.
services:
  - type: web
    name: nl-analytics-agent
    runtime: docker
    plan: free
    branch: release
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nl-analytics-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      # Usage limits (see SECURITY.md). Render sits behind Cloudflare, which puts the visitor's IP here.
      - key: CLIENT_IP_HEADER
        value: true-client-ip
      - key: SESSION_SECRET
        generateValue: true
      # Cloudflare Turnstile (free): create a widget for this site's domain, then paste both keys.
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      # Sign in with GitHub (optional, see DEPLOY.md): an OAuth app's keys and the web app's URL.
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: PUBLIC_URL
        sync: false
      # Calls per provider per UTC day, a little under each free tier (Groq: 1,000 a day for this model;
      # OpenRouter free models: 50 a day; Cloudflare: 10,000 neurons a day).
      - key: LLM_DAILY_BUDGET
        value: '{"groq": 900, "openrouter": 45, "cloudflare": 250}'

  - type: web
    name: nl-analytics-agent-staging
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # A Neon branch of production's database (DEPLOY.md), never production's own, and separate model keys so
      # tests on staging cannot use up production's free quotas.
      - key: DATABASE_URL
        sync: false
      - key: APP_DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: PUBLIC_URL
        sync: false
      - key: CURATORS
        sync: false
      - key: LLM_DAILY_BUDGET
        value: '{"groq": 200, "cloudflare": 100}'

databases:
  - name: nl-analytics-db
    plan: free
    databaseName: analytics
