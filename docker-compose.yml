services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: analytics
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 15

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/analytics
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
    command: sh -c "python -m app.seed --if-empty && uvicorn app.main:app --host 0.0.0.0 --port 8000"
