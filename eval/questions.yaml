# 30 labelled questions for measuring SQL correctness (execution accuracy).
# `ordered: true` means row order matters for the answer (rankings, time series).
# Gold SQL follows the business rules in the SQL agent's prompt (revenue = completed orders only, etc.).

- id: 1
  category: simple
  question: What was total revenue in 2025?
  gold_sql: |
    SELECT ROUND(SUM(oi.quantity * oi.unit_price), 2) AS revenue
    FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
    WHERE o.status = 'completed' AND o.order_date BETWEEN '2025-01-01' AND '2025-12-31'

- id: 2
  category: simple
  question: How many orders were cancelled in 2024?
  gold_sql: |
    SELECT COUNT(*) AS cancelled_orders FROM orders
    WHERE status = 'cancelled' AND order_date BETWEEN '2024-01-01' AND '2024-12-31'

- id: 3
  category: simple
  question: How many customers do we have in each segment?
  gold_sql: |
    SELECT segment, COUNT(*) AS customers FROM customers GROUP BY segment

- id: 4
  category: simple
  question: How many products are there in each category?
  gold_sql: |
    SELECT c.name AS category, COUNT(*) AS products
    FROM products p JOIN categories c ON c.category_id = p.category_id GROUP BY c.name

- id: 5
  category: simple
  question: What was the average order value in 2025?
  gold_sql: |
    SELECT ROUND(SUM(oi.quantity * oi.unit_price) / COUNT(DISTINCT o.order_id), 2) AS aov
    FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
    WHERE o.status = 'completed' AND o.order_date BETWEEN '2025-01-01' AND '2025-12-31'

- id: 6
  category: simple
  question: How many orders came through each channel in 2025?
  gold_sql: |
    SELECT channel, COUNT(*) AS orders FROM orders
    WHERE status = 'completed' AND order_date BETWEEN '2025-01-01' AND '2025-12-31'
    GROUP BY channel

- id: 7
  category: simple
  question: Which 5 products have the highest list price?
  ordered: true
  gold_sql: |
    SELECT name, list_price FROM products ORDER BY list_price DESC LIMIT 5

- id: 8
  category: simple
  question: How many customers are in the Middle East region?
  gold_sql: |
    SELECT COUNT(*) AS customers FROM customers c JOIN regions r ON r.region_id = c.region_id
    WHERE r.name = 'Middle East'

- id: 9
  category: joins
  question: Show revenue by region for 2025
  gold_sql: |
    SELECT r.name AS region, ROUND(SUM(oi.quantity * oi.unit_price), 2) AS revenue
    FROM orders o
    JOIN customers c ON c.customer_id = o.customer_id
    JOIN regions r ON r.region_id = c.region_id
    JOIN order_items oi ON oi.order_id = o.order_id
    WHERE o.status = 'completed' AND o.order_date BETWEEN '2025-01-01' AND '2025-12-31'
    GROUP BY r.name

- id: 10
  category: joins
  question: Top 10 products by revenue in 2025
  ordered: true
  gold_sql: |
    SELECT p.name AS product, ROUND(SUM(oi.quantity * oi.unit_price), 2) AS revenue
    FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
    JOIN products p ON p.product_id = oi.product_id
    WHERE o.status = 'completed' AND o.order_date BETWEEN '2025-01-01' AND '2025-12-31'
    GROUP BY p.product_id, p.name ORDER BY revenue DESC LIMIT 10

- id: 11
  category: joins
  question: Revenue by product category in 2024
  gold_sql: |
    SELECT c.name AS category, ROUND(SUM(oi.quantity * oi.unit_price), 2) AS revenue
    FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
    JOIN products p ON p.product_id = oi.product_id
    JOIN categories c ON c.category_id = p.category_id
    WHERE o.status = 'completed' AND o.order_date BETWEEN '2024-01-01' AND '2024-12-31'
    GROUP BY c.name

- id: 12
  category: joins
  question: Which category had the highest profit margin in 2025?
  gold_sql: |
    SELECT c.name AS category,
           ROUND(SUM(oi.quantity * (oi.unit_price - p.unit_cost)) / SUM(oi.quantity * oi.unit_price) * 100, 2) AS margin_pct
    FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
    JOIN products p ON p.product_id = oi.product_id
    JOIN categories c ON c.category_id = p.category_id
    WHERE o.status = 'completed' AND o.order_date BETWEEN '2025-01-01' AND '2025-12-31'
    GROUP BY c.name ORDER BY margin_pct DESC LIMIT 1

- id: 13
  category: joins
  question: Who are our top 5 customers by lifetime revenue?
  ordered: true
  gold_sql: |
    SELECT cu.name AS customer, ROUND(SUM(oi.quantity * oi.unit_price), 2) AS revenue
    FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
    JOIN customers cu ON cu.customer_id = o.customer_id
    WHERE o.status = 'completed'
    GROUP BY cu.customer_id, cu.name ORDER BY revenue DESC LIMIT 5

- id: 14
  category: joins
  question: What is the average order value for each customer segment?
  gold_sql: |
    SELECT cu.segment, ROUND(SUM(oi.quantity * oi.unit_price) / COUNT(DISTINCT o.order_id), 2) AS aov
    FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
    JOIN customers cu ON cu.customer_id = o.customer_id
    WHERE o.status = 'completed'
    GROUP BY cu.segment

- id: 15
  category: joins
  question: Revenue by country in 2025
  gold_sql: |
    SELECT r.country, ROUND(SUM(oi.quantity * oi.unit_price), 2) AS revenue
    FROM orders o JOIN customers c ON c.customer_id = o.customer_id
    JOIN regions r ON r.region_id = c.region_id
    JOIN order_items oi ON oi.order_id = o.order_id
    WHERE o.status = 'completed' AND o.order_date BETWEEN '2025-01-01' AND '2025-12-31'
