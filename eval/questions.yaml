- id: 109
  category: advanced
  difficulty: hard
  split: test
  question: Which category added the most revenue from 2024 to 2025, in rupees?
  gold_sql: |
    SELECT c.name AS category,
           ROUND(SUM(oi.quantity * oi.unit_price) FILTER (WHERE EXTRACT(YEAR FROM o.order_date) = 2025)
               - SUM(oi.quantity * oi.unit_price) FILTER (WHERE EXTRACT(YEAR FROM o.order_date) = 2024), 2) AS revenue_change
    FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
    JOIN products p ON p.product_id = oi.product_id
    JOIN categories c ON c.category_id = p.category_id
    WHERE o.status = 'completed'
    GROUP BY c.name ORDER BY revenue_change DESC LIMIT 1

