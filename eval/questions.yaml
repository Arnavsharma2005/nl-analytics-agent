# 120 labelled questions for measuring SQL correctness (execution accuracy).
# `ordered: true` means row order matters for the answer (rankings, time series).
# `split`: dev (50) may be used to tune prompts and to seed the verified-query library; test (70) is held out.
#   Report the test score, and never add a verified query that looks like a test question (CI checks this).
#   The first 30 are dev because the v1 prompts were written against them.
# `difficulty`: easy, medium or hard.
# Gold SQL follows the business rules in the SQL agent's prompt (revenue = completed orders only, etc.).

- id: 1
  category: simple
  difficulty: easy
  split: dev
  question: What was total revenue in 2025?
  gold_sql: |
    SELECT ROUND(SUM(oi.quantity * oi.unit_price), 2) AS revenue
    FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
    WHERE o.status = 'completed' AND o.order_date BETWEEN '2025-01-01' AND '2025-12-31'

- id: 2
  category: simple
  difficulty: easy
  split: dev
  question: How many orders were cancelled in 2024?
