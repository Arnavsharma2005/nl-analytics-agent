# Multi-turn conversations for measuring follow-up questions (I4). Each turn is asked with the earlier turns of
# its conversation, as the web app asks them, and is scored like a single question against its gold SQL. Gold SQL
# answers the turn as it should be understood with the earlier ones.
# `kind` says what the follow-up does: refine (adds a filter), period (changes the time range), metric (changes
# what is measured), dimension (changes the grouping), drill (narrows to one group), rank (changes the cut-off),
# fresh (a new question that must not inherit anything).
# `split`: as in questions.yaml, dev may be used to tune the rewrite prompt and test is held out.
# The first turn of every conversation is a plain question, so the gate "first turns behave exactly like single
# questions" is checked by the same run.

- id: 1
  split: dev
  turns:
    - question: Show revenue by region for 2025
      gold_sql: |
        SELECT r.name AS region, ROUND(SUM(oi.quantity * oi.unit_price), 2) AS revenue
        FROM orders o JOIN customers c ON c.customer_id = o.customer_id
        JOIN regions r ON r.region_id = c.region_id
        JOIN order_items oi ON oi.order_id = o.order_id
        WHERE o.status = 'completed' AND o.order_date BETWEEN '2025-01-01' AND '2025-12-31'
        GROUP BY r.name
    - question: and for 2024?
      kind: period
      gold_sql: |
        SELECT r.name AS region, ROUND(SUM(oi.quantity * oi.unit_price), 2) AS revenue
        FROM orders o JOIN customers c ON c.customer_id = o.customer_id
        JOIN regions r ON r.region_id = c.region_id
        JOIN order_items oi ON oi.order_id = o.order_id
        WHERE o.status = 'completed' AND o.order_date BETWEEN '2024-01-01' AND '2024-12-31'
        GROUP BY r.name
    - question: only through the mobile app
      kind: refine
      gold_sql: |
        SELECT r.name AS region, ROUND(SUM(oi.quantity * oi.unit_price), 2) AS revenue
        FROM orders o JOIN customers c ON c.customer_id = o.customer_id
        JOIN regions r ON r.region_id = c.region_id
        JOIN order_items oi ON oi.order_id = o.order_id
        WHERE o.status = 'completed' AND o.channel = 'mobile' AND o.order_date BETWEEN '2024-01-01' AND '2024-12-31'
        GROUP BY r.name

- id: 2
  split: dev
  turns:
    - question: Top 10 products by revenue in 2025
      ordered: true
      gold_sql: |
        SELECT p.name AS product, ROUND(SUM(oi.quantity * oi.unit_price), 2) AS revenue
        FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
        JOIN products p ON p.product_id = oi.product_id
        WHERE o.status = 'completed' AND o.order_date BETWEEN '2025-01-01' AND '2025-12-31'
        GROUP BY p.product_id, p.name ORDER BY revenue DESC LIMIT 10
    - question: just the top 3
      kind: rank
      ordered: true
      gold_sql: |
        SELECT p.name AS product, ROUND(SUM(oi.quantity * oi.unit_price), 2) AS revenue
        FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
        JOIN products p ON p.product_id = oi.product_id
        WHERE o.status = 'completed' AND o.order_date BETWEEN '2025-01-01' AND '2025-12-31'
        GROUP BY p.product_id, p.name ORDER BY revenue DESC LIMIT 3
    - question: What about in Electronics only?
      kind: refine
      ordered: true
      gold_sql: |
        SELECT p.name AS product, ROUND(SUM(oi.quantity * oi.unit_price), 2) AS revenue
        FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
        JOIN products p ON p.product_id = oi.product_id
        JOIN categories c ON c.category_id = p.category_id
        WHERE o.status = 'completed' AND c.name = 'Electronics'
          AND o.order_date BETWEEN '2025-01-01' AND '2025-12-31'
        GROUP BY p.product_id, p.name ORDER BY revenue DESC LIMIT 3

- id: 3
  split: dev
  turns:
    - question: Revenue by product category in 2024
      gold_sql: |
        SELECT c.name AS category, ROUND(SUM(oi.quantity * oi.unit_price), 2) AS revenue
        FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
        JOIN products p ON p.product_id = oi.product_id
        JOIN categories c ON c.category_id = p.category_id
        WHERE o.status = 'completed' AND o.order_date BETWEEN '2024-01-01' AND '2024-12-31'
        GROUP BY c.name
    - question: Now show units sold instead
      kind: metric
      gold_sql: |
        SELECT c.name AS category, SUM(oi.quantity) AS units
        FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
        JOIN products p ON p.product_id = oi.product_id
        JOIN categories c ON c.category_id = p.category_id
        WHERE o.status = 'completed' AND o.order_date BETWEEN '2024-01-01' AND '2024-12-31'
        GROUP BY c.name
    - question: How many customers do we have in each segment?
      kind: fresh
      gold_sql: |
        SELECT segment, COUNT(*) AS customers FROM customers GROUP BY segment

- id: 4
  split: dev
  turns:
    - question: How many orders came through each channel in 2025?
      gold_sql: |
        SELECT channel, COUNT(*) AS orders FROM orders
        WHERE order_date BETWEEN '2025-01-01' AND '2025-12-31' GROUP BY channel
    - question: How many of those were returned?
      kind: refine
      gold_sql: |
        SELECT channel, COUNT(*) AS returned_orders FROM orders
        WHERE status = 'returned' AND order_date BETWEEN '2025-01-01' AND '2025-12-31' GROUP BY channel

- id: 5
  split: dev
  turns:
    - question: What was our monthly revenue in 2025?
      ordered: true
      gold_sql: |
        SELECT DATE_TRUNC('month', o.order_date)::date AS month, ROUND(SUM(oi.quantity * oi.unit_price), 2) AS revenue
        FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
        WHERE o.status = 'completed' AND o.order_date BETWEEN '2025-01-01' AND '2025-12-31'
        GROUP BY 1 ORDER BY 1
    - question: Which of those months was the best?
      kind: rank
      gold_sql: |
        SELECT DATE_TRUNC('month', o.order_date)::date AS month, ROUND(SUM(oi.quantity * oi.unit_price), 2) AS revenue
        FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
        WHERE o.status = 'completed' AND o.order_date BETWEEN '2025-01-01' AND '2025-12-31'
        GROUP BY 1 ORDER BY revenue DESC LIMIT 1

- id: 6
  split: test
  turns:
    - question: Profit by region in 2025
      gold_sql: |
        SELECT r.name AS region, ROUND(SUM(oi.quantity * (oi.unit_price - p.unit_cost)), 2) AS profit
        FROM orders o JOIN customers c ON c.customer_id = o.customer_id
        JOIN regions r ON r.region_id = c.region_id
        JOIN order_items oi ON oi.order_id = o.order_id
        JOIN products p ON p.product_id = oi.product_id
        WHERE o.status = 'completed' AND o.order_date BETWEEN '2025-01-01' AND '2025-12-31'
        GROUP BY r.name
    - question: Break it down by customer segment instead
      kind: dimension
      gold_sql: |
        SELECT c.segment, ROUND(SUM(oi.quantity * (oi.unit_price - p.unit_cost)), 2) AS profit
        FROM orders o JOIN customers c ON c.customer_id = o.customer_id
        JOIN order_items oi ON oi.order_id = o.order_id
        JOIN products p ON p.product_id = oi.product_id
        WHERE o.status = 'completed' AND o.order_date BETWEEN '2025-01-01' AND '2025-12-31'
        GROUP BY c.segment
    - question: and just for the North region
      kind: drill
      gold_sql: |
        SELECT c.segment, ROUND(SUM(oi.quantity * (oi.unit_price - p.unit_cost)), 2) AS profit
        FROM orders o JOIN customers c ON c.customer_id = o.customer_id
        JOIN regions r ON r.region_id = c.region_id
        JOIN order_items oi ON oi.order_id = o.order_id
        JOIN products p ON p.product_id = oi.product_id
        WHERE o.status = 'completed' AND r.name = 'North' AND o.order_date BETWEEN '2025-01-01' AND '2025-12-31'
        GROUP BY c.segment

- id: 7
  split: test
  turns:
    - question: Who are our top 5 customers by lifetime revenue?
      ordered: true
      gold_sql: |
        SELECT c.name AS customer, ROUND(SUM(oi.quantity * oi.unit_price), 2) AS revenue
        FROM orders o JOIN customers c ON c.customer_id = o.customer_id
        JOIN order_items oi ON oi.order_id = o.order_id
        WHERE o.status = 'completed'
        GROUP BY c.customer_id, c.name ORDER BY revenue DESC LIMIT 5
    - question: same but only enterprise customers
      kind: refine
      ordered: true
      gold_sql: |
        SELECT c.name AS customer, ROUND(SUM(oi.quantity * oi.unit_price), 2) AS revenue
        FROM orders o JOIN customers c ON c.customer_id = o.customer_id
        JOIN order_items oi ON oi.order_id = o.order_id
        WHERE o.status = 'completed' AND c.segment = 'enterprise'
        GROUP BY c.customer_id, c.name ORDER BY revenue DESC LIMIT 5
    - question: How many orders has each of them placed?
      kind: metric
      gold_sql: |
        WITH top AS (
          SELECT c.customer_id, c.name FROM orders o JOIN customers c ON c.customer_id = o.customer_id
          JOIN order_items oi ON oi.order_id = o.order_id
          WHERE o.status = 'completed' AND c.segment = 'enterprise'
          GROUP BY c.customer_id, c.name ORDER BY SUM(oi.quantity * oi.unit_price) DESC LIMIT 5
        )
        SELECT top.name AS customer, COUNT(o.order_id) AS orders
        FROM top JOIN orders o ON o.customer_id = top.customer_id GROUP BY top.customer_id, top.name

- id: 8
  split: test
  turns:
    - question: Revenue by quarter in 2025
      ordered: true
      gold_sql: |
        SELECT EXTRACT(QUARTER FROM o.order_date)::int AS quarter, ROUND(SUM(oi.quantity * oi.unit_price), 2) AS revenue
        FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
        WHERE o.status = 'completed' AND o.order_date BETWEEN '2025-01-01' AND '2025-12-31'
        GROUP BY 1 ORDER BY 1
    - question: Compare that with 2024
      kind: period
      ordered: true
      gold_sql: |
        SELECT EXTRACT(YEAR FROM o.order_date)::int AS year, EXTRACT(QUARTER FROM o.order_date)::int AS quarter,
               ROUND(SUM(oi.quantity * oi.unit_price), 2) AS revenue
        FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
        WHERE o.status = 'completed' AND o.order_date BETWEEN '2024-01-01' AND '2025-12-31'
        GROUP BY 1, 2 ORDER BY 1, 2

- id: 9
  split: test
  turns:
    - question: How many customers are in each region?
      gold_sql: |
        SELECT r.name AS region, COUNT(*) AS customers
        FROM customers c JOIN regions r ON r.region_id = c.region_id GROUP BY r.name
    - question: How many of them signed up in 2025?
      kind: refine
      gold_sql: |
        SELECT r.name AS region, COUNT(*) AS customers
        FROM customers c JOIN regions r ON r.region_id = c.region_id
        WHERE c.signup_date BETWEEN '2025-01-01' AND '2025-12-31' GROUP BY r.name
    - question: What is the average list price of products in each category?
      kind: fresh
      gold_sql: |
        SELECT c.name AS category, ROUND(AVG(p.list_price), 2) AS avg_list_price
        FROM products p JOIN categories c ON c.category_id = p.category_id GROUP BY c.name

- id: 10
  split: test
  turns:
    - question: What share of 2025 revenue came from each channel?
      gold_sql: |
        SELECT o.channel,
               ROUND(SUM(oi.quantity * oi.unit_price) * 100 / SUM(SUM(oi.quantity * oi.unit_price)) OVER (), 2) AS share_pct
        FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
        WHERE o.status = 'completed' AND o.order_date BETWEEN '2025-01-01' AND '2025-12-31'
        GROUP BY o.channel
    - question: and in the Middle East?
      kind: drill
      gold_sql: |
        SELECT o.channel,
               ROUND(SUM(oi.quantity * oi.unit_price) * 100 / SUM(SUM(oi.quantity * oi.unit_price)) OVER (), 2) AS share_pct
        FROM orders o JOIN customers c ON c.customer_id = o.customer_id
        JOIN regions r ON r.region_id = c.region_id
        JOIN order_items oi ON oi.order_id = o.order_id
        WHERE o.status = 'completed' AND r.name = 'Middle East' AND o.order_date BETWEEN '2025-01-01' AND '2025-12-31'
        GROUP BY o.channel
