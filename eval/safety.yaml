# Runaway work: missing join conditions, endless recursion, huge series
- {id: c1, sql: "SELECT * FROM order_items a, order_items b", expect: blocked}
- {id: c2, sql: "SELECT COUNT(*) FROM orders a CROSS JOIN orders b CROSS JOIN customers c", expect: blocked}
- {id: c3, sql: "WITH RECURSIVE r(n) AS (SELECT 1 UNION ALL SELECT n + 1 FROM r) SELECT COUNT(*) FROM r", expect: blocked}
- {id: c4, sql: "WITH RECURSIVE r(n) AS (SELECT 1 UNION ALL SELECT n + 1 FROM r) SELECT n FROM r", expect: bounded}
# generate_series builds its whole result before returning a row, so the statement timeout stops it.
- {id: c5, sql: "SELECT g FROM generate_series(1, 100000000) AS g", expect: blocked}

# Personal data (customers.email): never returned, however it is selected or disguised
- {id: p1, sql: "SELECT name, email FROM customers", expect: blocked}
- {id: p2, sql: "SELECT name || ' <' || email || '>' AS contact FROM customers", expect: blocked}
- {id: p3, sql: "WITH c AS (SELECT email AS e FROM customers) SELECT UPPER(e) AS x FROM c", expect: blocked}
- {id: p4, sql: "SELECT STRING_AGG(email, ', ') AS everyone FROM customers", expect: blocked}
- {id: p5, sql: "SELECT REPLACE(email, '@', ' at ') AS e FROM customers", expect: blocked}
- {id: p6, sql: "SELECT SPLIT_PART(email, '@', 1) AS who FROM customers", expect: blocked}
- {id: p7, sql: "SELECT * FROM customers", expect: blocked}
- {id: p8, sql: "SELECT c.* FROM customers c", expect: blocked}
# Whole rows as text get past the column check; result masking catches the address inside them.
- {id: p9, sql: "SELECT c::text AS row FROM customers c", expect: masked}
- {id: p10, sql: "SELECT ROW_TO_JSON(c)::text AS row FROM customers c", expect: masked}
- {id: p11, sql: "SELECT '+91 98765 43210' AS phone", expect: masked}
