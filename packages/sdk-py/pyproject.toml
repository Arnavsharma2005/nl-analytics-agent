[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "nl-analytics-sdk"
version = "0.1.0"
description = "Python client for the NL analytics agent's /v1 API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.7,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/nl_analytics"]
